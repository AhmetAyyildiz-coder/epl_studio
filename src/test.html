                        function wcpGetPrintersOnSuccess() {
                            // Display client installed printers
                            if (arguments[0].length > 0) {



                                var p = arguments[0].split("|");


                                var options = '';



                                var sectim = '';
                                for (var i = 0; i < p.length; i++) {
                                    options += '<option ';
                                    if (p[i].indexOf("Label") >= 0 || p[i].indexOf("Argox") >= 0) {

                                        if (sectim == 1) {
                                            if (p[i].indexOf("\\") >= 0) {
                                                sectim = 0;
                                            } else {
                                                options += 'selected="selected"';
                                                sectim = 1;
                                            }

                                        }
                                        else {
                                            options += 'selected="selected"';
                                            sectim = 1;
                                        }
                                    }
                                    options += '>' + p[i] + '</option>';
                                }


                                //for (var i = 0; i < p.length; i++) {
                                //    options += '<option>' + p[i] + '</option>';
                                //}








                                $('#installedPrinterName').html(options);
                                $('#installedPrinterName').focus();
                                $('#loadPrinters').hide();
                            } else {
                                alert("No printers are installed in your system.");
                            }
                        }

                        function wcpGetPrintersOnFailure() {
                            // Do something if printers cannot be got from the client 
                            alert("No printers are installed in your system.");
                        }

                /* FORM to WIZARD */
                /* Created by jankoatwarpspeed.com */

                (function ($) {
                    $.fn.formToWizard = function () {

                        var element = this;

                        var steps = $(element).find("fieldset");
                        var count = steps.size();


                        // 2
                        $(element).before("<ul id='steps'></ul>");

                        steps.each(function (i) {
                            $(this).wrap("<div id='step" + i + "'></div>");
                            $(this).append("<p id='step" + i + "commands'></p>");

                            // 2
                            var name = $(this).find("legend").html();
                            $("#steps").append("<li id='stepDesc" + i + "'>Step " + (i + 1) + "<span>" + name + "</span></li>");

                            if (i == 0) {
                                createNextButton(i);
                                selectStep(i);
                            }
                            else if (i == count - 1) {
                                $("#step" + i).hide();
                                createPrevButton(i);
                            }
                            else {
                                $("#step" + i).hide();
                                createPrevButton(i);
                                createNextButton(i);
                            }
                        });

                        function createPrevButton(i) {
                            var stepName = "step" + i;
                            $("#" + stepName + "commands").append("<a href='#' id='" + stepName + "Prev' class='prev btn btn-info'>< Back</a>");

                            $("#" + stepName + "Prev").bind("click", function (e) {
                                $("#" + stepName).hide();
                                $("#step" + (i - 1)).show();

                                selectStep(i - 1);
                            });
                        }

                        function createNextButton(i) {
                            var stepName = "step" + i;
                            $("#" + stepName + "commands").append("<a href='#' id='" + stepName + "Next' class='next btn btn-info'>Next ></a>");

                            $("#" + stepName + "Next").bind("click", function (e) {
                                $("#" + stepName).hide();
                                $("#step" + (i + 1)).show();

                                selectStep(i + 1);
                            });
                        }

                        function selectStep(i) {
                            $("#steps li").removeClass("current");
                            $("#stepDesc" + i).addClass("current");
                        }

                    }
                })(jQuery);
